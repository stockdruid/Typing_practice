<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타자연습</title>
    <link rel="stylesheet" href="project_1.css">
</head>
<body>

    <h1>타자연습</h1>

    <p id="count">문장 1 / 5</p>

    <div id="sentence">
        The quick brown fox jumps over the lazy dog.
    </div>

    <input type="text" id="typing" placeholder="위 문장을 따라 쳐보세요">

    <div id="result">
        <p>타수: 0</p>
        <p>정확도: 0%</p>
        <p>시간: 0초</p>
    </div>

    <div id="final">
        <h2>최종 결과</h2>
        <p>평균 타수: 0</p>
        <p>평균 정확도: 0%</p>
        <p>총 시간: 0초</p>
    </div>

    <button id="restart">다시 하기</button>

    <hr>

    <h2>단어 떨어지는 게임</h2>

    <p>점수: <span id="score">0</span> / 목숨: <span id="life">3</span></p>

    <div id="game" style="position: relative; height: 400px; border: 1px solid black; overflow: hidden;">
    </div>

    <input type="text" id="word" placeholder="떨어지는 단어를 쳐보세요">

    <button id="gameStart">게임 시작</button>

    <script src="project_1.js"></script>

</body>
</html>
